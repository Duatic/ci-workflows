name: title check
description: >-
  Asserts that a pull request title has the conventional commit shape the changelogs use:
  <type>(<scope>)?!?: <subject>. main is squash-merged, so the title is the commit message that
  lands there. Also asserts that a package.xml version changes only in a `release:` pull request.
  Requires the caller to have checked out the repository first.

runs:
  using: composite
  steps:
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        # release is what check_release_pr.py keys on; the rest match the changelog bullets.
        # feature is an alias for feat: prepare_release.py treats them identically.
        types: |
          feat
          feature
          deprecate
          fix
          docs
          chore
          ci
          test
          refactor
          revert
          perf
          build
          release

    - name: A version change needs a release title
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        BASE: ${{ github.event.pull_request.base.ref }}
      run: |
        # The merge base is needed, and callers check out with depth 1.
        if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
          git fetch --quiet --unshallow origin
        fi
        git fetch --quiet origin "$BASE"
        python3 "${{ github.action_path }}/../../release/check_release_pr.py" \
          --base "origin/$BASE" --head HEAD --title "$PR_TITLE"
