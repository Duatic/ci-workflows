name: title check
description: >-
  Asserts that a pull request title has the conventional commit shape the changelogs use:
  <type>(<scope>)?!?: <subject>. main is squash-merged, so the title is the commit message that
  lands there.

runs:
  using: composite
  steps:
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      env:
        GITHUB_TOKEN: ${{ github.token }}
      with:
        # release is what check_release_pr.py keys on; the rest match the changelog bullets.
        types: |
          feat
          fix
          docs
          chore
          ci
          test
          refactor
          perf
          build
          release
