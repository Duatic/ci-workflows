name: release build
# Builds the .deb for one package at a tag with duatic_devtools' builder and uploads it as an
# artifact. Signing and publishing belong to the archive host, not to a runner.
#
# Dispatch it here with a repository, a tag and a package. The Ubuntu base to build against is
# derived from ros_distro, since each ROS 2 distro has exactly one supported Ubuntu base.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/name of the repository holding the tag'
        required: true
        type: string
      tag:
        description: 'The tag or ref to build from'
        required: true
        type: string
      package:
        description: 'The package to build, by its package.xml name'
        required: true
        type: string
      ros_distro:
        description: 'ROS distro to build for'
        default: 'jazzy'
        type: string
  workflow_call:
    inputs:
      repository:
        description: 'owner/name of the repository holding the tag. Empty means the caller.'
        default: ''
        type: string
      tag:
        required: true
        type: string
      package:
        required: true
        type: string
      ros_distro:
        default: 'jazzy'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.tag }}
          path: src

      - uses: actions/checkout@v4
        with:
          repository: Duatic/duatic_devtools
          ref: v1
          path: .devtools

      - name: Build the package into a .deb
        id: build
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          ROS_DISTRO_TARGET: ${{ inputs.ros_distro }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          docker run --rm -i \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e ROS_DISTRO="$ROS_DISTRO_TARGET" \
            -v "$PWD/src:/src" \
            -v "$PWD/.devtools/packaging/builder:/builder" \
            -v "$RUNNER_TEMP/out:/out" \
            "ros:${ROS_DISTRO_TARGET}-ros-base" \
            /builder/build_pkg.sh "$PACKAGE" < /dev/null
          echo "artifact=${PACKAGE}-${TAG//\//-}-${ROS_DISTRO_TARGET}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.artifact }}
          path: ${{ runner.temp }}/out/*.deb
