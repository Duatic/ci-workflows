name: release build
# Builds the .deb for one package at a tag with duatic_devtools' builder, for amd64 and arm64 unless
# architectures says otherwise, and uploads one artifact per architecture. Signing and publishing
# belong to the archive host, not to a runner. A build of main names its commit as the tag and
# gives version_suffix, which is appended to the version in package.xml.
#
# Dispatch it here with a repository, a tag and a package. The Ubuntu base to build against is
# derived from ros_distro, since each ROS 2 distro has exactly one supported Ubuntu base.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'owner/name of the repository holding the tag'
        required: true
        type: string
      tag:
        description: 'The tag or ref to build from'
        required: true
        type: string
      package:
        description: 'The package to build, by its package.xml name'
        required: true
        type: string
      ros_distro:
        description: 'ROS distro to build for'
        default: 'jazzy'
        type: string
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        type: string
      arm64_runner:
        description: 'Native arm64 runner label(s) for the arm64 build, e.g. "ubuntu-24.04-arm" or a self-hosted label.'
        default: 'ubuntu-24.04-arm'
        type: string
      architectures:
        description: 'JSON list of the architectures to build, e.g. ["amd64"]'
        default: '["amd64", "arm64"]'
        type: string
      continue_on_failure:
        description: 'Report a failed build as a warning and upload nothing, rather than failing the run.'
        default: false
        type: boolean
      version_suffix:
        description: 'Appended to the version in package.xml, e.g. "+git20261027153012.ab12cd3" for a build of main'
        default: ''
        type: string
      archive_channels:
        description: 'Archive channels whose packages the build depends on, e.g. "edge stable" for a build of main'
        default: 'stable'
        type: string
  workflow_call:
    inputs:
      repository:
        description: 'owner/name of the repository holding the tag. Empty means the caller.'
        default: ''
        type: string
      tag:
        required: true
        type: string
      package:
        required: true
        type: string
      ros_distro:
        default: 'jazzy'
        type: string
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      arm64_runner:
        description: 'Native arm64 runner label(s) for the arm64 build, e.g. "ubuntu-24.04-arm" or a self-hosted label.'
        default: 'ubuntu-24.04-arm'
        required: false
        type: string
      architectures:
        description: 'JSON list of the architectures to build, e.g. ["amd64"]'
        default: '["amd64", "arm64"]'
        required: false
        type: string
      continue_on_failure:
        description: 'Report a failed build as a warning and upload nothing, rather than failing the run.'
        default: false
        required: false
        type: boolean
      version_suffix:
        description: 'Appended to the version in package.xml, e.g. "+git20261027153012.ab12cd3" for a build of main'
        default: ''
        required: false
        type: string
      archive_channels:
        description: 'Archive channels whose packages the build depends on, e.g. "edge stable" for a build of main'
        default: 'stable'
        required: false
        type: string
    outputs:
      artifact:
        description: 'Artifact name without its architecture: one artifact per architecture built, <artifact>-<arch>'
        value: ${{ jobs.build.outputs.artifact }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architectures) }}
    runs-on: ${{ matrix.arch == 'arm64' && inputs.arm64_runner || inputs.runner }}
    timeout-minutes: 30
    outputs:
      artifact: ${{ steps.build.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository || github.repository }}
          ref: ${{ inputs.tag }}
          path: src

      - uses: actions/checkout@v4
        with:
          repository: Duatic/duatic_devtools
          ref: v1
          path: .devtools

      # Dependencies on packages already published resolve from the archive the ARCHIVE_URL
      # organization variable names, trusted by its key's fingerprint.
      - name: Fetch the archive key
        if: vars.ARCHIVE_URL != ''
        env:
          ARCHIVE_URL: ${{ vars.ARCHIVE_URL }}
          FPR: ${{ vars.ARCHIVE_KEY_FINGERPRINT }}
        run: |
          [ -n "$FPR" ] || { echo "::error::ARCHIVE_URL is set without ARCHIVE_KEY_FINGERPRINT"; exit 1; }
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/duatic-archive.gpg"
          curl -fsSL "${ARCHIVE_URL%/}/duatic-archive.gpg" -o "$key"
          fprs="$(gpg --show-keys --with-colons "$key" | awk -F: '/^pub/{p=1; next} p && /^fpr/{print $10; p=0}')"
          [ "$fprs" = "$FPR" ] \
            || { echo "::error::the archive key is ${fprs:-unreadable}, not $FPR" | tr "\n" " "; exit 1; }

      - name: Build the package into a .deb
        id: build
        continue-on-error: ${{ inputs.continue_on_failure }}
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          ROS_DISTRO_TARGET: ${{ inputs.ros_distro }}
          ARCH: ${{ matrix.arch }}
          SUFFIX: ${{ inputs.version_suffix }}
          ARCHIVE_URL: ${{ vars.ARCHIVE_URL }}
          ARCHIVE_CHANNELS: ${{ inputs.archive_channels }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          archive=()
          if [ -n "$ARCHIVE_URL" ]; then
            archive=(-e ARCHIVE_URL="$ARCHIVE_URL" -e ARCHIVE_CHANNELS="$ARCHIVE_CHANNELS"
              -e ARCHIVE_KEYRING=/keys/duatic-archive.gpg -v "$RUNNER_TEMP/keys:/keys:ro")
          fi
          docker run --rm -i --platform "linux/$ARCH" \
            -e HOST_UID="$(id -u)" -e HOST_GID="$(id -g)" \
            -e ROS_DISTRO="$ROS_DISTRO_TARGET" \
            -e DEB_VERSION_SUFFIX="$SUFFIX" \
            "${archive[@]}" \
            -v "$PWD/src:/src" \
            -v "$PWD/.devtools/packaging/builder:/builder" \
            -v "$RUNNER_TEMP/out:/out" \
            "ros:${ROS_DISTRO_TARGET}-ros-base" \
            /builder/build_pkg.sh "$PACKAGE" < /dev/null
          # Fail unless a .deb of this architecture was produced.
          ls "$RUNNER_TEMP"/out/*_"$ARCH".deb >/dev/null \
            || { echo "::error::no ${ARCH} .deb produced"; ls "$RUNNER_TEMP/out"; exit 1; }
          # A builder that ignored the suffix would produce the release's version.
          if [ -n "$SUFFIX" ]; then
            for deb in "$RUNNER_TEMP"/out/*.deb; do
              v="$(dpkg-deb -f "$deb" Version)"
              case "$v" in
                *"$SUFFIX"-*) ;;
                *) echo "::error::$(basename "$deb") is version $v, without $SUFFIX"; exit 1 ;;
              esac
            done
          fi
          echo "artifact=${PACKAGE}-${TAG//\//-}-${ROS_DISTRO_TARGET}" >> "$GITHUB_OUTPUT"

      # Debug symbols are a .ddeb, which a *.deb glob misses. build_pkg.sh collects them and the
      # archive indexes them, so leaving them here is where they would be lost. A package declaring
      # <duatic_publish_source> also has a source tarball, which the archive refuses to do without.
      - name: Report the failed build
        if: steps.build.outcome == 'failure'
        env:
          PACKAGE: ${{ inputs.package }}
          TAG: ${{ inputs.tag }}
          ROS_DISTRO_TARGET: ${{ inputs.ros_distro }}
          ARCH: ${{ matrix.arch }}
        run: |
          msg="${PACKAGE} at ${TAG} did not build for ${ROS_DISTRO_TARGET} on ${ARCH}; nothing was uploaded"
          echo "::warning::${msg}"
          echo "- ${msg}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: ${{ steps.build.outputs.artifact }}-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/out/*.deb
            ${{ runner.temp }}/out/*.ddeb
            ${{ runner.temp }}/out/*.src.tar.gz
