name: release tag
# Central, org-wide reusable workflow. When a release pull request merges, tags each package it
# released as <package>/<version> at the merge commit and publishes a GitHub Release per tag with
# that version's changelog section as its notes. A package tag never moves.
#
# It then builds the .debs of every released package that declares <duatic_archive_root>, for each
# distro in ros_distros on amd64 and arm64. A distro or architecture that does not build is a
# warning and uploads nothing; a released package without a root is not built, also a warning.
#
# What built is handed to a private publisher repository, which publishes it from a self-hosted
# runner: self-hosted runners never take jobs from public repositories. The caller passes
# secrets: inherit so RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY reach the dispatch.
#
# The calling job must grant contents: write; a called workflow cannot raise the token above what
# its caller holds. Requires a squash- or merge-committed pull request: a rebase merge's first
# parent is not pre-merge main, so nothing is found to tag.
#
# Called by a product repository on the close of a pull request:
#
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     tag:
#       if: github.event.pull_request.merged
#       permissions:
#         contents: write
#       uses: Duatic/ci-workflows/.github/workflows/reusable_release_tag.yml@v1

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      publisher:
        description: 'Repository in this organization that publishes what was built; empty takes the RELEASE_PUBLISHER organization variable'
        default: ''
        required: false
        type: string
      ros_distros:
        description: 'JSON list of the ROS distros to build the released packages for'
        default: '["jazzy", "kilted", "lyrical", "rolling"]'
        required: false
        type: string
    outputs:
      released:
        description: 'JSON list of {package, version, tag, root} it tagged; [] when the pull request released nothing'
        value: ${{ jobs.tag.outputs.released }}

permissions:
  contents: write

jobs:
  tag:
    runs-on: ${{ inputs.runner }}
    outputs:
      released: ${{ steps.tag.outputs.released || '[]' }}
      build: ${{ steps.tag.outputs.build || '[]' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      # checkout above takes the calling repository. job.workflow_ref names this file's own
      # repository and revision, so a caller pinning the workflow pins the scripts with it.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: .checks

      # Preinstalled on GitHub-hosted runners; a self-hosted runner may not have it.
      - name: Ensure the GitHub CLI is available
        run: |
          command -v gh >/dev/null && exit 0
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported architecture for gh: $(uname -m)"; exit 1 ;;
          esac
          version=2.62.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_${arch}/bin" >> "$GITHUB_PATH"

      - name: Tag each released package and publish its notes
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE: ${{ github.event.pull_request.merge_commit_sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # A bare-version title belongs to reusable_repo_release_tag.yml, not this workflow.
          if printf '%s' "$PR_TITLE" | grep -qiE '^release(\([^)]*\))?!?:[[:space:]]*[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$'; then
            echo "titled as a repo-wide release; nothing for the per-package tag workflow to do"
            exit 0
          fi
          if ! printf '%s' "$PR_TITLE" | grep -qiE '^release(\([^)]*\))?!?:'; then
            echo "not a release pull request; nothing to tag"
            exit 0
          fi
          python3 .checks/release/released_packages.py \
            --base "${MERGE}^1" --head "$MERGE" > "$RUNNER_TEMP/released"
          if [ ! -s "$RUNNER_TEMP/released" ]; then
            echo "::error::titled as a release, but no package version changed in the merge"
            exit 1
          fi
          # A tag already at the merge commit is a rerun and is kept; one anywhere else is a clash.
          while read -r name version _; do
            at=$(git rev-parse -q --verify "refs/tags/${name}/${version}^{commit}" || true)
            if [ -n "$at" ] && [ "$at" != "$MERGE" ]; then
              echo "::error::tag ${name}/${version} already exists at ${at}"
              exit 1
            fi
          done < "$RUNNER_TEMP/released"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          while read -r name version dir; do
            tag="${name}/${version}"
            python3 .checks/release/changelog_section.py "${dir}/CHANGELOG.rst" "$version" \
              > "$RUNNER_TEMP/notes.md"
            git rev-parse -q --verify "refs/tags/${tag}" >/dev/null || git tag "$tag" "$MERGE"
            git push origin "$tag"
            gh release view "$tag" >/dev/null 2>&1 \
              || gh release create "$tag" --title "${name} ${version}" --notes-file "$RUNNER_TEMP/notes.md"
            echo "released ${tag}"
          done < "$RUNNER_TEMP/released"
          python3 - "$RUNNER_TEMP/released" <<'PY'
          import json, os, sys
          import xml.etree.ElementTree as ET
          released = []
          for name, version, pkg_dir in (line.split() for line in open(sys.argv[1]) if line.strip()):
              export = ET.parse(os.path.join(pkg_dir, "package.xml")).getroot().find("export")
              root = (export.findtext("duatic_archive_root") or "").strip() if export is not None else ""
              released.append({"package": name, "version": version, "tag": f"{name}/{version}", "root": root})
              if not root:
                  print(f"::warning::{name} {version} was released but not built: it declares no "
                        "<duatic_archive_root>, so it cannot reach the apt archive")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("released=" + json.dumps(released) + "\n")
              out.write("build=" + json.dumps([r for r in released if r["root"]]) + "\n")
          PY

  # The tolerance lives in the build workflow: a job calling a reusable workflow cannot itself be
  # allowed to fail.
  build:
    needs: tag
    if: needs.tag.outputs.build != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.tag.outputs.build) }}
        ros_distro: ${{ fromJSON(inputs.ros_distros) }}
    uses: Duatic/ci-workflows/.github/workflows/reusable_release_build.yml@v1
    with:
      tag: ${{ matrix.release.tag }}
      package: ${{ matrix.release.package }}
      ros_distro: ${{ matrix.ros_distro }}
      runner: ${{ inputs.runner }}
      continue_on_failure: true

  publish:
    needs: [tag, build]
    if: ${{ !cancelled() && needs.tag.outputs.build != '[]' }}
    runs-on: ${{ inputs.runner }}
    permissions:
      actions: read
    steps:
      - name: Check a publisher and the release App are available
        id: app
        env:
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          PUBLISHER: ${{ inputs.publisher || vars.RELEASE_PUBLISHER }}
        run: |
          if [ -z "$PUBLISHER" ]; then
            echo "::warning::not published: no publisher repository named; set the RELEASE_PUBLISHER organization variable"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$APP_ID" ]; then
            echo "::warning::not published: RELEASE_APP_ID does not reach this workflow; give the tag job secrets: inherit"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "publisher=$PUBLISHER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/create-github-app-token@v2
        if: steps.app.outputs.ok == 'true'
        id: token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ steps.app.outputs.publisher }}
          permission-contents: write

      - name: Hand what built to the publisher
        if: steps.app.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_TOKEN: ${{ steps.token.outputs.token }}
          BUILD: ${{ needs.tag.outputs.build }}
          DISTROS: ${{ inputs.ros_distros }}
          PUBLISHER: ${{ github.repository_owner }}/${{ steps.app.outputs.publisher }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          api, repo, run = os.environ["GITHUB_API_URL"], os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]

          def call(url, token, body=None):
              req = urllib.request.Request(url, data=body, headers={
                  "Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read() or b"null")

          built, page = set(), 1
          while True:
              got = call(f"{api}/repos/{repo}/actions/runs/{run}/artifacts?per_page=100&page={page}",
                         os.environ["GH_TOKEN"])["artifacts"]
              built |= {a["name"] for a in got}
              if len(got) < 100:
                  break
              page += 1

          # Named as reusable_release_build.yml names them; a leg that failed uploaded nothing.
          artifacts = []
          for release in json.loads(os.environ["BUILD"]):
              for distro in json.loads(os.environ["DISTROS"]):
                  for arch in ("amd64", "arm64"):
                      name = f'{release["package"]}-{release["tag"].replace("/", "-")}-{distro}-{arch}'
                      if name in built:
                          artifacts.append({"artifact": name, **release, "distro": distro, "arch": arch})
          if not artifacts:
              print("::warning::nothing built, so nothing was handed to the publisher")
              raise SystemExit(0)
          payload = {"repository": repo, "run_id": run, "artifacts": artifacts}
          call(f'{api}/repos/{os.environ["PUBLISHER"]}/dispatches', os.environ["DISPATCH_TOKEN"],
               json.dumps({"event_type": "publish", "client_payload": payload}).encode())
          for a in artifacts:
              print(f'handed {a["artifact"]} to {os.environ["PUBLISHER"]}')
          PY
