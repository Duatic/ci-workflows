name: pre-commit
# Central, org-wide reusable workflow that runs pre-commit hooks across all files.
# Consumers: uses: Duatic/ci-workflows/.github/workflows/pre-commit.yml@v1

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      python_version:
        description: 'Python version used to run pre-commit.'
        default: '3.13'
        required: false
        type: string
      devtools_ref:
        description: 'Take .pre-commit-config.yaml from this duatic_devtools revision. Empty uses the calling repository''s own config.'
        default: ''
        required: false
        type: string

jobs:
  pre-commit:
    name: Format
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version }}
      # pre-commit reads a config only from the root of the repository being checked, so the shared
      # one is fetched rather than referenced.
      - name: Take the shared config
        if: inputs.devtools_ref != ''
        env:
          REF: ${{ inputs.devtools_ref }}
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Duatic/duatic_devtools/$REF/.pre-commit-config.yaml" \
            -o .pre-commit-config.yaml

      - uses: pre-commit/action@v3.0.1
        with:
          extra_args: --all-files --hook-stage manual
