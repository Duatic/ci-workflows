name: CI orchestrator
# Consumer-facing entry point for ROS 2 package CI across the Duatic org.
# Consumers: uses: Duatic/ci-workflows/.github/workflows/ci_orchestrator.yml@v2
#
# Owns everything that shouldn't be re-decided per repo:
#   - the distro x architecture matrix, each leg built and tested natively on the image
#     factory's ci image for its architecture (amd64 and arm64 unless `architectures` says less)
#   - gating: the primary distro (jazzy) must succeed before the rest run, unless `gated` is false
#   - auto-cancelling a superseded run on the same ref
#   - on draft PRs only the primary distro builds, the rest of the (expensive) matrix waits for review
#   - a push or pull request that changes only files matching paths_ignore (docs by default)
#     skips the build and test legs; they report as skipped, which passes required checks
#   - a scheduled run deletes the repository's ci images built before today, which no run reuses
#
# Consumers only choose: their schedule cron, whether they have a CI_PAT secret, and
# optionally a single distro to build via workflow_dispatch. A repository that publishes nightly
# images schedules reusable_nightly_orchestrator.yml instead, which runs this before its image
# build.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'Distro to build. "all" (default) runs the full gated matrix; a single distro name builds only that one.'
        default: 'all'
        required: false
        type: string
      extra_distros:
        description: 'Comma-separated distros to add to the secondary matrix when ros_distro is "all", e.g. "humble".'
        default: ''
        required: false
        type: string
      gated:
        description: 'Run the secondary distros only once the primary distro succeeded. false runs every distro at once.'
        default: true
        required: false
        type: boolean
      architectures:
        description: 'JSON list of the architectures to build and test each distro on, of amd64 and arm64.'
        default: '["amd64","arm64"]'
        required: false
        type: string
      runner:
        description: 'Runner label(s) for the amd64 legs and every other job, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      runner_arm64:
        description: 'Runner label(s) for the arm64 legs.'
        default: 'ubuntu-24.04-arm'
        required: false
        type: string
      devtools_ref:
        description: 'Take .pre-commit-config.yaml from this duatic_devtools revision. Empty uses the calling repository''s own config.'
        default: ''
        required: false
        type: string
      paths_ignore:
        description: 'Comma-separated shell patterns ("*" also matches "/"). A push or pull request changing only matching files skips building and testing.'
        default: '*.md,docs/*,LICENSE*,*.png,*.jpg,*.jpeg,*.svg,.github/ISSUE_TEMPLATE/*,.github/pull_request_template.md'
        required: false
        type: string
    secrets:
      CI_PAT:
        description: 'Optional PAT used to clone private upstream dependencies listed in a repos.list workspace file.'
        required: false

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Plan distro matrix
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      primary: ${{ steps.plan.outputs.primary }}
      secondary: ${{ steps.plan.outputs.secondary }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      # Builds unless the event's changed files are all ignored. Schedules, manual runs, a
      # first push and a comparison that may be truncated (300 files) always build.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PATHS_IGNORE: ${{ inputs.paths_ignore }}
        run: |
          set -uo pipefail
          build=true
          if [[ "$GITHUB_EVENT_NAME" =~ ^(push|pull_request)$ && -n "$BASE" && ! "$BASE" =~ ^0+$ ]] &&
            files=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" |
              jq -r 'if (.files | length) < 300 then .files[].filename else error("truncated") end'); then
            build=false
            set -f
            IFS=, read -r -a patterns <<<"$PATHS_IGNORE"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              ignored=false
              for p in "${patterns[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                # $p is unquoted on purpose: paths_ignore entries are globs.
                # shellcheck disable=SC2053
                [[ -n "$p" && "$f" == $p ]] && { ignored=true; break; }
              done
              $ignored || { echo "Builds for: $f"; build=true; break; }
            done <<<"$files"
          fi
          echo "build=${build}" | tee -a "$GITHUB_OUTPUT"
      - id: plan
        env:
          SEL_DISTRO: ${{ inputs.ros_distro }}
          EXTRA_DISTROS: ${{ inputs.extra_distros }}
          ARCHITECTURES: ${{ inputs.architectures }}
          GATED: ${{ inputs.gated }}
        run: |
          # Each architecture has its own jobs below, so any other value would silently build nothing.
          jq -e 'length > 0 and all(.[]; . == "amd64" or . == "arm64")' <<<"$ARCHITECTURES" >/dev/null ||
            { echo "::error::architectures must list amd64 and/or arm64, got ${ARCHITECTURES}"; exit 1; }
          entry() { printf '"%s"' "$1"; }
          if [ -z "$SEL_DISTRO" ] || [ "$SEL_DISTRO" = "all" ]; then
            primary="[$(entry jazzy)]"
            extra=""
            for d in ${EXTRA_DISTROS//,/ }; do extra="${extra}$(entry "$d"),"; done
            secondary="[${extra}$(entry kilted),$(entry lyrical),$(entry rolling)]"
          else
            primary="[$(entry "$SEL_DISTRO")]"
            secondary="[]"
          fi
          # Ungated, every distro is a primary leg, so none waits on another.
          if [ "$GATED" = "false" ]; then
            primary=$(jq -c --argjson s "$secondary" '. + $s' <<<"$primary")
            secondary="[]"
          fi
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          echo "secondary=${secondary}" >> "$GITHUB_OUTPUT"

  # One primary and one secondary job per architecture, so a secondary leg waits only on the
  # primary leg of its own architecture. arch stays a matrix axis to keep the check names.
  primary-amd64:
    name: primary
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' && contains(fromJSON(inputs.architectures), 'amd64') }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.primary) }}
        arch: [amd64]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with: &ci_inputs
      ros_distro: ${{ matrix.ros_distro }}
      arch: ${{ matrix.arch }}
      runner: ${{ inputs.runner }}
      runner_arm64: ${{ inputs.runner_arm64 }}
    secrets: inherit

  primary-arm64:
    name: primary
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' && contains(fromJSON(inputs.architectures), 'arm64') }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.primary) }}
        arch: [arm64]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with: *ci_inputs
    secrets: inherit

  secondary-amd64:
    name: secondary
    needs: [prepare, primary-amd64]
    if: ${{ needs.prepare.outputs.secondary != '[]' && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.secondary) }}
        arch: [amd64]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with: *ci_inputs
    secrets: inherit

  secondary-arm64:
    name: secondary
    needs: [prepare, primary-arm64]
    if: ${{ needs.prepare.outputs.secondary != '[]' && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.secondary) }}
        arch: [arm64]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with: *ci_inputs
    secrets: inherit

  pre-commit:
    name: pre-commit
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    permissions:
      contents: read
    uses: ./.github/workflows/pre-commit.yml
    with:
      runner: ${{ inputs.runner }}
      devtools_ref: ${{ inputs.devtools_ref }}

  # A ci image's key holds the day it was built, so one built before today is never reused.
  prune:
    name: Prune ci images
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ${{ inputs.runner }}
    continue-on-error: true
    permissions:
      contents: read
      packages: write
    steps:
      - name: Delete ci images built before today
        uses: Duatic/duatic_ros2_docker_images/actions/prune-images@v1
        with:
          targets: ci

  # Coalesces every leg's badge artifact into a single badges branch commit.
  badges:
    name: Publish status badges
    needs: [prepare, primary-amd64, primary-arm64, secondary-amd64, secondary-arm64]
    if: ${{ always() && needs.prepare.outputs.build == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Download badge artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: badges
          merge-multiple: true

      # One badge per distro over its architectures: failing when any leg failed, otherwise
      # cancelled or not run when any leg was, otherwise passing.
      - name: Combine each distro's legs, filling legs that did not run
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
          SECONDARY: ${{ needs.prepare.outputs.secondary }}
          ARCHITECTURES: ${{ inputs.architectures }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p badges distros
          legs=$(jq -r -n --argjson p "$PRIMARY" --argjson s "$SECONDARY" --argjson a "$ARCHITECTURES" \
            '($p + $s)[] as $d | $a[] | "\($d) \(.)"')
          while read -r d a; do
            f="badges/${REPO}-${d}-${a}.json"
            [ -f "$f" ] || printf '{"label":"%s","message":"not run","color":"lightgrey"}\n' "$d" > "$f"
          done <<<"$legs"
          while read -r d; do
            jq -s '{schemaVersion: 1, label: .[0].label} + (
                [.[] | select(.message == "failing")][0] //
                [.[] | select(.message != "passing")][0] // .[0] | {message, color})' \
              badges/"${REPO}-${d}"-*.json > "distros/${REPO}-${d}.json"
          done < <(cut -d' ' -f1 <<<"$legs" | sort -u)

      - name: Publish badges to branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          src="$PWD/distros"
          mkdir out && cd out
          git init -q -b badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on the existing branch so badges of distros not built this run are kept
          if git fetch -q --depth=1 origin badges; then git reset -q --hard FETCH_HEAD; fi
          for f in "$src"/*.json; do
            d=$(jq -r .label "$f")
            curl -sSfG https://img.shields.io/static/v1 -o "${d}.svg" \
              --data-urlencode "label=${d}" \
              --data-urlencode "message=$(jq -r .message "$f")" \
              --data-urlencode "color=$(jq -r .color "$f")"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged, nothing to publish."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update status badges"
          git push -q origin HEAD:badges
