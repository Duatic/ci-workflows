name: CI orchestrator
# Consumer-facing entry point for ROS 2 package CI across the Duatic org.
# Consumers: uses: Duatic/ci-workflows/.github/workflows/ci_orchestrator.yml@v2
#
# Owns everything that shouldn't be re-decided per repo:
#   - the distro matrix, each distro built and tested on the image factory's ci image
#   - gating: the primary distro (jazzy) must succeed before the rest run
#   - auto-cancelling a superseded run on the same ref
#   - on draft PRs only the primary distro builds, the rest of the (expensive) matrix waits for review
#   - a push or pull request that changes only files matching paths_ignore (docs by default)
#     skips the build and test legs; they report as skipped, which passes required checks
#
# Consumers only choose: their schedule cron, whether they have a CI_PAT secret, and
# optionally a single distro to build via workflow_dispatch. Schedule CI before the nightly
# image build (e.g. 00:30 and 01:30 Europe/Zurich): the first CI run of the day builds that
# day's ci image, which the nightly then reuses.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'Distro to build. "all" (default) runs the full gated matrix; a single distro name builds only that one.'
        default: 'all'
        required: false
        type: string
      extra_distros:
        description: 'Comma-separated distros to add to the secondary matrix when ros_distro is "all", e.g. "humble".'
        default: ''
        required: false
        type: string
      runner:
        description: 'Runner label(s) to run all jobs on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      badge_branch:
        description: 'Publish per-distro pass/fail status badges as SVGs to the "badges" branch of the calling repository. Requires the caller to grant "contents: write". Only written for runs on the default branch.'
        default: false
        required: false
        type: boolean
      devtools_ref:
        description: 'Take .pre-commit-config.yaml from this duatic_devtools revision. Empty uses the calling repository''s own config.'
        default: ''
        required: false
        type: string
      paths_ignore:
        description: 'Comma-separated shell patterns ("*" also matches "/"). A push or pull request changing only matching files skips building and testing.'
        default: '*.md,docs/*,LICENSE*,*.png,*.jpg,*.jpeg,*.svg,.github/ISSUE_TEMPLATE/*,.github/pull_request_template.md'
        required: false
        type: string
    secrets:
      CI_PAT:
        description: 'Optional PAT used to clone private upstream dependencies listed in a repos.list workspace file.'
        required: false

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Plan distro matrix
    runs-on: ${{ inputs.runner }}
    permissions:
      contents: read
    outputs:
      primary: ${{ steps.plan.outputs.primary }}
      secondary: ${{ steps.plan.outputs.secondary }}
      build: ${{ steps.changes.outputs.build }}
    steps:
      # Builds unless the event's changed files are all ignored. Schedules, manual runs, a
      # first push and a comparison that may be truncated (300 files) always build.
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PATHS_IGNORE: ${{ inputs.paths_ignore }}
        run: |
          set -uo pipefail
          build=true
          if [[ "$GITHUB_EVENT_NAME" =~ ^(push|pull_request)$ && -n "$BASE" && ! "$BASE" =~ ^0+$ ]] &&
            files=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/compare/${BASE}...${HEAD}" |
              jq -r 'if (.files | length) < 300 then .files[].filename else error("truncated") end'); then
            build=false
            set -f
            IFS=, read -r -a patterns <<<"$PATHS_IGNORE"
            while IFS= read -r f; do
              [[ -z "$f" ]] && continue
              ignored=false
              for p in "${patterns[@]}"; do
                p="${p#"${p%%[![:space:]]*}"}"
                p="${p%"${p##*[![:space:]]}"}"
                [[ -n "$p" && "$f" == $p ]] && { ignored=true; break; }
              done
              $ignored || { echo "Builds for: $f"; build=true; break; }
            done <<<"$files"
          fi
          echo "build=${build}" | tee -a "$GITHUB_OUTPUT"
      - id: plan
        env:
          SEL_DISTRO: ${{ inputs.ros_distro }}
          EXTRA_DISTROS: ${{ inputs.extra_distros }}
        run: |
          entry() { printf '"%s"' "$1"; }
          if [ -z "$SEL_DISTRO" ] || [ "$SEL_DISTRO" = "all" ]; then
            primary="[$(entry jazzy)]"
            extra=""
            for d in ${EXTRA_DISTROS//,/ }; do extra="${extra}$(entry "$d"),"; done
            secondary="[${extra}$(entry kilted),$(entry lyrical),$(entry rolling)]"
          else
            primary="[$(entry "$SEL_DISTRO")]"
            secondary="[]"
          fi
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          echo "secondary=${secondary}" >> "$GITHUB_OUTPUT"

  primary:
    name: primary
    needs: prepare
    if: ${{ needs.prepare.outputs.build == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.primary) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      runner: ${{ inputs.runner }}
      badge_branch: ${{ inputs.badge_branch }}
    secrets: inherit

  secondary:
    name: secondary
    needs: [prepare, primary]
    if: ${{ needs.prepare.outputs.secondary != '[]' && !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    strategy:
      fail-fast: false
      matrix:
        ros_distro: ${{ fromJSON(needs.prepare.outputs.secondary) }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/reusable_ci.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      runner: ${{ inputs.runner }}
      badge_branch: ${{ inputs.badge_branch }}
    secrets: inherit

  pre-commit:
    name: pre-commit
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    permissions:
      contents: read
    uses: ./.github/workflows/pre-commit.yml
    with:
      runner: ${{ inputs.runner }}
      devtools_ref: ${{ inputs.devtools_ref }}

  # Coalesces every leg's badge artifact into a single badges branch commit.
  badges:
    name: Publish status badges
    needs: [prepare, primary, secondary]
    if: ${{ always() && inputs.badge_branch && needs.prepare.outputs.build == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Download badge artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: badges
          merge-multiple: true

      - name: Fill missing badges for legs that did not run
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
          SECONDARY: ${{ needs.prepare.outputs.secondary }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p badges
          distros=$(jq -r -n --argjson p "$PRIMARY" --argjson s "$SECONDARY" \
            '($p + $s)[]')
          for d in $distros; do
            f="badges/${REPO}-${d}.json"
            if [ ! -f "$f" ]; then
              printf '{"schemaVersion":1,"label":"%s","message":"not run","color":"lightgrey"}\n' \
                "$d" > "$f"
            fi
          done

      - name: Publish badges to branch
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          src="$PWD/badges"
          mkdir out && cd out
          git init -q -b badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on the existing branch so badges of distros not built this run are kept
          if git fetch -q --depth=1 origin badges; then git reset -q --hard FETCH_HEAD; fi
          for f in "$src"/*.json; do
            d=$(jq -r .label "$f")
            curl -sSfG https://img.shields.io/static/v1 -o "${d}.svg" \
              --data-urlencode "label=${d}" \
              --data-urlencode "message=$(jq -r .message "$f")" \
              --data-urlencode "color=$(jq -r .color "$f")"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged, nothing to publish."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update status badges"
          git push -q origin HEAD:badges
