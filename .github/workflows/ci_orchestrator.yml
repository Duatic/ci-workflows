name: CI orchestrator
# Consumer-facing entry point for ROS 2 package CI across the Duatic org.
# Consumers: uses: Duatic/ci-workflows/.github/workflows/ci_orchestrator.yml@v1
#
# Owns everything that shouldn't be re-decided per repo:
#   - the distro matrix and the ROS_REPO channel per distro (rolling -> testing, else main)
#   - gating: the primary distro (jazzy) must succeed before the rest run
#   - auto-cancelling a superseded run on the same ref
#   - a cheap failing check on draft PRs instead of running the full (expensive) matrix
#
# Consumers only choose: their schedule cron, whether they have a CI_PAT secret, and
# optionally a single distro to build via workflow_dispatch.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'Distro to build. "all" (default) runs the full gated matrix; a single distro name builds only that one.'
        default: 'all'
        required: false
        type: string
      runner:
        description: 'Runner label(s) to run all jobs on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      badge_gist_id:
        description: 'Optional gist ID to publish per-distro pass/fail status badges to. Empty (default) disables badge publishing. Only written for runs on the default branch.'
        default: ''
        required: false
        type: string
      badge_branch:
        description: 'Publish per-distro pass/fail status badges as SVGs to the "badges" branch of the calling repository. Requires the caller to grant "contents: write". Only written for runs on the default branch.'
        default: false
        required: false
        type: boolean
      devtools_ref:
        description: 'Take .pre-commit-config.yaml from this duatic_devtools revision. Empty uses the calling repository''s own config.'
        default: ''
        required: false
        type: string
    secrets:
      CI_PAT:
        description: 'Optional PAT used to clone private upstream dependencies listed in a repos.list workspace file.'
        required: false
      GIST_TOKEN:
        description: 'PAT with "gist" scope, required only when badge_gist_id is set.'
        required: false

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  draft_guard:
    name: Draft PR - CI skipped
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Fail fast on draft PRs
        run: |
          echo "::error::CI does not run on draft PRs to save compute. Mark this PR 'Ready for review' to run the full build."
          exit 1

  prepare:
    name: Plan distro matrix
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    runs-on: ${{ inputs.runner }}
    outputs:
      primary: ${{ steps.plan.outputs.primary }}
      secondary: ${{ steps.plan.outputs.secondary }}
    steps:
      - id: plan
        env:
          SEL_DISTRO: ${{ inputs.ros_distro }}
        run: |
          channel() { case "$1" in rolling) echo testing;; *) echo main;; esac; }
          entry() { printf '{"ros_distro":"%s","ros_repo":"%s"}' "$1" "$(channel "$1")"; }
          if [ -z "$SEL_DISTRO" ] || [ "$SEL_DISTRO" = "all" ]; then
            primary="[$(entry jazzy)]"
            secondary="[$(entry kilted),$(entry lyrical),$(entry rolling)]"
          else
            primary="[$(entry "$SEL_DISTRO")]"
            secondary="[]"
          fi
          echo "primary=${primary}" >> "$GITHUB_OUTPUT"
          echo "secondary=${secondary}" >> "$GITHUB_OUTPUT"

  primary:
    name: primary
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.primary) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      ros_repo: ${{ matrix.ros_repo }}
      runner: ${{ inputs.runner }}
      badge_gist_id: ${{ inputs.badge_gist_id }}
      badge_branch: ${{ inputs.badge_branch }}
    secrets: inherit

  secondary:
    name: secondary
    needs: [prepare, primary]
    if: ${{ needs.prepare.outputs.secondary != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.secondary) }}
    permissions:
      contents: read
    uses: ./.github/workflows/reusable_ici.yml
    with:
      ros_distro: ${{ matrix.ros_distro }}
      ros_repo: ${{ matrix.ros_repo }}
      runner: ${{ inputs.runner }}
      badge_gist_id: ${{ inputs.badge_gist_id }}
      badge_branch: ${{ inputs.badge_branch }}
    secrets: inherit

  pre-commit:
    name: pre-commit
    if: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.draft) }}
    permissions:
      contents: read
    uses: ./.github/workflows/pre-commit.yml
    with:
      runner: ${{ inputs.runner }}
      devtools_ref: ${{ inputs.devtools_ref }}

  # Coalesces every leg's badge artifact into a single gist patch and/or badges branch commit.
  badges:
    name: Publish status badges
    needs: [prepare, primary, secondary]
    if: ${{ always() && (inputs.badge_gist_id != '' || inputs.badge_branch) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Download badge artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: badge-*
          path: badges
          merge-multiple: true

      - name: Fill missing badges for legs that did not run
        env:
          PRIMARY: ${{ needs.prepare.outputs.primary }}
          SECONDARY: ${{ needs.prepare.outputs.secondary }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p badges
          distros=$(jq -r -n --argjson p "$PRIMARY" --argjson s "$SECONDARY" \
            '($p + $s)[].ros_distro')
          for d in $distros; do
            f="badges/${REPO}-${d}.json"
            if [ ! -f "$f" ]; then
              printf '{"schemaVersion":1,"label":"%s","message":"not run","color":"lightgrey"}\n' \
                "$d" > "$f"
            fi
          done

      - name: Publish badges to gist
        if: ${{ inputs.badge_gist_id != '' }}
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ inputs.badge_gist_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(badges/*.json)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No badge artifacts found, nothing to publish."
            exit 0
          fi
          payload=$(jq -n '{files:{}}')
          for f in "${files[@]}"; do
            payload=$(jq --arg n "$(basename "$f")" --rawfile c "$f" '.files[$n]={content:$c}' <<<"$payload")
          done
          curl -sSf -X PATCH \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/${GIST_ID}" \
            -d "$payload" > /dev/null

      - name: Publish badges to branch
        if: ${{ inputs.badge_branch }}
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          src="$PWD/badges"
          mkdir out && cd out
          git init -q -b badges
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Build on the existing branch so badges of distros not built this run are kept
          if git fetch -q --depth=1 origin badges; then git reset -q --hard FETCH_HEAD; fi
          for f in "$src"/*.json; do
            d=$(jq -r .label "$f")
            curl -sSfG https://img.shields.io/static/v1 -o "${d}.svg" \
              --data-urlencode "label=${d}" \
              --data-urlencode "message=$(jq -r .message "$f")" \
              --data-urlencode "color=$(jq -r .color "$f")"
          done
          git add -A
          if git diff --cached --quiet; then
            echo "Badges unchanged, nothing to publish."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -qm "Update status badges"
          git push -q origin HEAD:badges
