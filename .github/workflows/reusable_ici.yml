name: ROS industrial_ci
# original author: Denis Štogl <denis@stoglrobotics.de>
# Central, org-wide reusable workflow for building ROS 2 packages with industrial_ci.
# Builds ONE distro/channel combination. Not meant to be called directly by product repos —
# use ci_orchestrator.yml, which drives this per distro with the matrix/gating logic.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'ROS_DISTRO variable for industrial_ci'
        required: true
        type: string
      ros_repo:
        description: 'ROS_REPO to run for industrial_ci. Possible values: "main", "testing"'
        default: 'main'
        required: false
        type: string
      timeout_minutes:
        description: 'Maximum time the job is allowed to run.'
        default: 60
        required: false
        type: number
      ccache_dir:
        description: 'CCache dir that should be used. Relative to github.workspace'
        default: '.ccache'
        required: false
        type: string
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      badge_gist_id:
        description: 'Deprecated, removed in the next major release, use badge_branch. Optional gist ID to publish a pass/fail status badge to. Empty (default) disables badge publishing. Only written for runs on the default branch.'
        default: ''
        required: false
        type: string
      badge_branch:
        description: 'Write a pass/fail status badge artifact for the orchestrator to publish to the badges branch. Only written for runs on the default branch.'
        default: false
        required: false
        type: boolean
    secrets:
      CI_PAT:
        description: 'Optional PAT used to clone private upstream dependencies listed in the repos.list workspace file.'
        required: false
      GIST_TOKEN:
        description: 'Deprecated, removed with badge_gist_id in the next major release. PAT with "gist" scope, required only when badge_gist_id is set.'
        required: false

jobs:
  ici:
    name: ${{ inputs.ros_distro }} ${{ inputs.ros_repo }}
    timeout-minutes: ${{ inputs.timeout_minutes }}
    runs-on: ${{ inputs.runner }}
    env:
      CCACHE_DIR: ${{ github.workspace }}/${{ inputs.ccache_dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # checkout above takes the calling repository. job.workflow_ref names this file's own
      # repository and revision, so a caller pinning the workflow pins the scripts with it.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: .checks

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the repos file parser
        run: python -m pip install --quiet pyyaml

      - name: Detect upstream workspace, extra apt dependencies, and pip requirements
        id: detect
        env:
          CI_PAT: ${{ secrets.CI_PAT }}
          SELF_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if [ -f repos.list ]; then
            # Flatten the repos.list files of every dependency into one list; disagreeing pins fail here.
            if [ -n "$CI_PAT" ]; then
              export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
              GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$CI_PAT" | base64 -w0)"
              export GIT_CONFIG_VALUE_0
            fi
            GIT_TERMINAL_PROMPT=0 python3 .checks/upstream/expand_repos.py repos.list \
              --exclude-url "$SELF_URL" > .upstream.repos
            cat .upstream.repos
            echo "upstream_workspace=.upstream.repos" >> "$GITHUB_OUTPUT"
          else
            echo "upstream_workspace=" >> "$GITHUB_OUTPUT"
          fi
          if [ -f Aptfile ]; then
            packages=$(grep -v '^\s*#' Aptfile | tr '\n' ' ')
            echo "before_install=sudo apt-get install -y -qq ${packages}" >> "$GITHUB_OUTPUT"
          else
            echo "before_install=" >> "$GITHUB_OUTPUT"
          fi
          # Every requirements.txt file is resolved together so conflicting versions are detected.
          mapfile -t requirements < <(find . \( -name build -o -name install -o -name log -o -name .venv -o -name node_modules \) -prune \
            -o -type f -name requirements.txt -print | LC_ALL=C sort)
          if [ ${#requirements[@]} -gt 0 ]; then
            echo "pip_install=python3 -m pip install --break-system-packages --ignore-installed$(printf ' -r %q' "${requirements[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "pip_install=" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ inputs.ros_distro }}-${{ steps.detect.outputs.upstream_workspace }}-${{ inputs.ros_repo }}-${{ github.job }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.ros_distro }}-${{ steps.detect.outputs.upstream_workspace }}-${{ inputs.ros_repo }}-${{ github.job }}-${{ github.sha }}
            ccache-${{ inputs.ros_distro }}-${{ steps.detect.outputs.upstream_workspace }}-${{ inputs.ros_repo }}-${{ github.job }}

      - name: industrial_ci
        id: ici
        uses: 'ros-industrial/industrial_ci@master'
        env:
          UPSTREAM_WORKSPACE: ${{ steps.detect.outputs.upstream_workspace }}
          ROS_DISTRO: ${{ inputs.ros_distro }}
          ROS_REPO: ${{ inputs.ros_repo }}
          # Install CycloneDDS as the RMW implementation
          ADDITIONAL_DEBS: ros-${{ inputs.ros_distro }}-rmw-cyclonedds-cpp
          DOCKER_RUN_OPTS: -e RMW_IMPLEMENTATION=rmw_cyclonedds_cpp -e GIT_TERMINAL_PROMPT=0
          BEFORE_INSTALL_UPSTREAM_DEPENDENCIES: ${{ steps.detect.outputs.before_install }}
          AFTER_INSTALL_TARGET_DEPENDENCIES: ${{ steps.detect.outputs.pip_install }}
          BEFORE_INIT: >-
            ${{ secrets.CI_PAT != '' && format('apt-get update -qq && apt-get install -y -qq git && git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf "x-access-token:%s" "{0}" | base64 -w0)"', secrets.CI_PAT) || '' }}

      - name: Write badge artifact
        if: ${{ always() && (inputs.badge_gist_id != '' || inputs.badge_branch) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p badge
          status="failing"
          color="red"
          case "${{ steps.ici.outcome }}" in
            success)   status="passing";   color="brightgreen";;
            cancelled) status="cancelled"; color="lightgrey";;
          esac
          cat > "badge/${{ github.event.repository.name }}-${{ inputs.ros_distro }}.json" <<EOF
          {"schemaVersion":1,"label":"${{ inputs.ros_distro }}","message":"${status}","color":"${color}"}
          EOF

      - name: Upload badge artifact
        if: ${{ always() && (inputs.badge_gist_id != '' || inputs.badge_branch) && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        uses: actions/upload-artifact@v4
        with:
          name: badge-${{ inputs.ros_distro }}
          path: badge/*.json
          retention-days: 1
