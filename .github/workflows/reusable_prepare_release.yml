name: prepare release
# Central, org-wide reusable workflow. Opens the pull request that releases one package: the
# changelog section and version bump come from the commits since the package's last tag, and a
# person reviews them before anything is tagged.
#
# Opened with a personal access token: one opened with GITHUB_TOKEN starts no workflows, so it
# would carry no checks.
#
# Called by a product repository from a workflow_dispatch:
#
#   jobs:
#     prepare:
#       uses: Duatic/ci-workflows/.github/workflows/reusable_prepare_release.yml@v1
#       with:
#         package: ${{ inputs.package }}
#         bump: ${{ inputs.bump }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      package:
        description: 'The package to release, by its package.xml name.'
        required: true
        type: string
      bump:
        description: 'major, minor or patch. Empty or "derived" takes it from the commits.'
        default: ''
        required: false
        type: string
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
    secrets:
      RELEASE_PAT:
        description: 'Token with repo scope. The pull request it opens triggers workflows; one opened with GITHUB_TOKEN does not.'
        required: true

jobs:
  prepare:
    runs-on: ${{ inputs.runner }}
    steps:
      # The generator reads history and tags; the push below reuses this token.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.RELEASE_PAT }}

      # checkout above takes the calling repository. job.workflow_ref names this file's own
      # repository and revision, so a caller pinning the workflow pins the scripts with it.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: .checks

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the changelog parser
        run: python -m pip install --quiet catkin_pkg

      - name: Write the changelog section and bump the version
        id: prepare
        env:
          PACKAGE: ${{ inputs.package }}
          BUMP: ${{ inputs.bump }}
        run: |
          args=(--package "$PACKAGE" --summary "$RUNNER_TEMP/body.md")
          [ -z "$BUMP" ] || [ "$BUMP" = derived ] || args+=(--bump "$BUMP")
          python3 .checks/release/prepare_release.py "${args[@]}"
          manifest=$(git diff --name-only -- ':(glob)**/package.xml')
          if [ -z "$manifest" ] || [ "$(printf '%s\n' "$manifest" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one changed package.xml, found: ${manifest:-none}"
            exit 1
          fi
          version=$(python3 -c 'import sys, xml.etree.ElementTree as ET
          print(ET.parse(sys.argv[1]).getroot().findtext("version"))' "$manifest")
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit on a release branch
        id: branch
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.prepare.outputs.version }}
          MANIFEST: ${{ steps.prepare.outputs.manifest }}
        run: |
          branch="release/${PACKAGE}-${VERSION}"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::branch ${branch} already exists; close or delete its pull request first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -- "$(dirname "$MANIFEST")/CHANGELOG.rst" "$MANIFEST"
          git commit -m "release: ${PACKAGE} ${VERSION}"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

      - name: The checks a release pull request gets
        env:
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.prepare.outputs.version }}
          BASE: ${{ github.ref_name }}
        run: |
          python3 .checks/release/check_release_pr.py \
            --base "origin/$BASE" --head HEAD --title "release: ${PACKAGE} ${VERSION}"
          python3 .checks/release/check_changelog_format.py --base "origin/$BASE" --head HEAD

      - name: Push and open a draft pull request
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BASE: ${{ github.ref_name }}
          PACKAGE: ${{ inputs.package }}
          VERSION: ${{ steps.prepare.outputs.version }}
        run: |
          git push origin "$BRANCH"
          gh pr create --draft --base "$BASE" --head "$BRANCH" \
            --title "release: ${PACKAGE} ${VERSION}" --body-file "$RUNNER_TEMP/body.md"
