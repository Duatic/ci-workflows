name: title check
# Central, org-wide reusable workflow. Asserts that a pull request title has the conventional commit
# shape the changelogs use: <type>(<scope>)?!?: <subject>. main is squash-merged, so the title is
# the commit message that lands there.
#
# Called by a product repository as:
#
#   jobs:
#     title:
#       if: github.event_name == 'pull_request'
#       uses: Duatic/ci-workflows/.github/workflows/reusable_title_check.yml@v1

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string

permissions:
  pull-requests: read

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # release is what check_release_pr.py keys on; the rest match the changelog bullets.
          types: |
            feat
            fix
            docs
            chore
            ci
            test
            refactor
            perf
            build
            release
