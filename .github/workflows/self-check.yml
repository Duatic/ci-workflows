name: Self-check
# Runs pre-commit against this repo's own files (workflow YAML, docs), dogfooding the
# pre-commit.yml leaf workflow that every consumer repo gets via ci_orchestrator.yml, runs the
# suite for the release checks in release/, and dogfoods the title-check action on this repo's own
# pull requests.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pre-commit:
    uses: ./.github/workflows/pre-commit.yml
    with:
      devtools_ref: v1

  title-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./actions/title-check

  release-checks:
    name: release checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python syntax
        run: python3 -m py_compile release/*.py

      # The prepare suite runs the format check on what it produced, which reads with catkin_pkg.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet catkin_pkg

      - name: Release check suite
        run: release/test_check_release_pr.sh
      - name: Prepare release suite
        run: release/test_prepare_release.sh
      - name: Released packages suite
        run: release/test_released_packages.sh
