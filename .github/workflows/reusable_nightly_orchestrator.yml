name: Nightly orchestrator
# Consumer-facing entry point for the nightly run of a repository that publishes nightly images.
# Consumers: uses: Duatic/ci-workflows/.github/workflows/reusable_nightly_orchestrator.yml@v2
#
# Runs CI (ci_orchestrator.yml) over the full matrix, then the image factory's nightly dev and
# runtime images, which reuse the ci images CI just built. The images build whatever CI's result:
# a dev image falls back to a lean one when the workspace does not compile.
# A repository calling this keeps no schedule on its ci_orchestrator.yml caller.

on:
  workflow_call:
    inputs:
      ros_distro:
        description: 'Distro to test and build, e.g. "jazzy". Empty runs every distro.'
        default: ''
        required: false
        type: string
      publish:
        description: 'Push the images to ghcr.io and publish their badges.'
        default: false
        required: false
        type: boolean
      runner:
        description: 'Runner label(s) for the amd64 legs and every other job, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string
      runner_arm64:
        description: 'Runner label(s) for the arm64 legs.'
        default: 'ubuntu-24.04-arm'
        required: false
        type: string
      architectures:
        description: 'JSON list of the architectures to test and build images for, of amd64 and arm64.'
        default: '["amd64","arm64"]'
        required: false
        type: string
      extra_distros:
        description: 'Comma-separated distros to test and build besides the default set when ros_distro is empty, e.g. "humble".'
        default: ''
        required: false
        type: string

jobs:
  ci:
    permissions:
      contents: write   # badges branch
      packages: write
    uses: ./.github/workflows/ci_orchestrator.yml
    with:
      ros_distro: ${{ inputs.ros_distro || 'all' }}
      extra_distros: ${{ inputs.extra_distros }}
      runner: ${{ inputs.runner }}
      runner_arm64: ${{ inputs.runner_arm64 }}
      architectures: ${{ inputs.architectures }}
    secrets: inherit

  image:
    needs: ci
    if: ${{ !cancelled() }}
    permissions:
      contents: write   # image-badges branch
      packages: write
    uses: Duatic/duatic_ros2_docker_images/.github/workflows/reusable_nightly_image.yml@v1
    with:
      # The image factory's default set, as in ci_orchestrator.yml, plus the extra distros.
      ros_distro: ${{ inputs.ros_distro || (inputs.extra_distros && format('{0},jazzy,kilted,lyrical,rolling', inputs.extra_distros)) || '' }}
      publish: ${{ inputs.publish }}
      runner: ${{ inputs.runner }}
      runner_arm64: ${{ inputs.runner_arm64 }}
      architectures: ${{ inputs.architectures }}
    secrets: inherit
