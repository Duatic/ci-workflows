name: release check
# Central, org-wide reusable workflow. Asserts that a pull request is internally consistent about
# what it releases: the package.xml version, the CHANGELOG.rst section and the PR title must agree.
#
# The checks live in this repository under release/, so changing what a release means is one commit
# here rather than one per repository.
#
# Called by a product repository as:
#
#   jobs:
#     release-check:
#       uses: Duatic/ci-workflows/.github/workflows/reusable_release_check.yml@main

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string

jobs:
  check:
    runs-on: ${{ inputs.runner }}
    steps:
      # The check compares against the merge base, so it needs history rather than a shallow clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # checkout above takes the calling repository. job.workflow_ref names this file's own
      # repository and revision, so a caller pinning the workflow pins the checks with it.
      - name: Resolve this workflow's own revision
        id: self
        env:
          WORKFLOW_REF: ${{ job.workflow_ref }}
        run: |
          [ -n "$WORKFLOW_REF" ] || { echo "::error::job.workflow_ref is empty"; exit 1; }
          echo "repo=${WORKFLOW_REF%%/.github/*}" >> "$GITHUB_OUTPUT"
          echo "ref=${WORKFLOW_REF#*@}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.self.outputs.repo }}
          ref: ${{ steps.self.outputs.ref }}
          path: .checks

      # setup-python rather than the system interpreter: Ubuntu 24.04 marks that one externally
      # managed and refuses pip.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the changelog parser
        run: python -m pip install --quiet catkin_pkg

      - name: Version, changelog and title must agree
        env:
          # From the event rather than the ref: a pull request's title is not in the git history,
          # and it is one of the three things being compared.
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --quiet origin "$BASE"
          python3 .checks/release/check_release_pr.py \
            --base "origin/$BASE" --head HEAD --title "$PR_TITLE"

      # Only the changelogs this pull request touches, so a repository converts as it goes.
      - name: Touched changelogs still parse the way bloom reads them
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 .checks/release/check_changelog_format.py \
            --base "origin/$BASE" --head HEAD
