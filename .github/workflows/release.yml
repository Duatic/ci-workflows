name: Release
# Manually cut a new semver release for this repo: computes the next version
# from the latest tag, creates the immutable vX.Y.Z tag, force-moves the
# floating major tag (vN) to the same commit, and publishes a GitHub Release
# with auto-generated notes. Dispatch from the branch you want to release
# (normally main).

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which part of the version to increment'
        type: choice
        options: [patch, minor, major]
        default: patch
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        type: string
  # Callable from other repositories, which then release themselves through this one file.
  workflow_call:
    inputs:
      bump:
        description: 'Which part of the version to increment: patch, minor or major'
        type: string
        default: patch
      runner:
        description: 'Runner label(s) to run the job on, e.g. "ubuntu-latest" or "self-hosted".'
        default: 'ubuntu-latest'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag -l 'v*.*.*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac
          new="v${major}.${minor}.${patch}"
          if git rev-parse -q --verify "refs/tags/${new}" >/dev/null; then
            echo "::error::Tag ${new} already exists"
            exit 1
          fi
          echo "new=${new}" >> "$GITHUB_OUTPUT"
          echo "major=v${major}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${new} (from ${latest}); moving major tag v${major}"

      - name: Create and push tags
        env:
          NEW: ${{ steps.version.outputs.new }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$NEW"
          git tag -f "$MAJOR"
          git push origin "$NEW"
          git push -f origin "$MAJOR"

      # Preinstalled on GitHub-hosted runners; a self-hosted runner may not have it.
      - name: Ensure the GitHub CLI is available
        run: |
          command -v gh >/dev/null && exit 0
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported architecture for gh: $(uname -m)"; exit 1 ;;
          esac
          version=2.62.0
          curl -fsSL "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${version}_linux_${arch}/bin" >> "$GITHUB_PATH"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ${{ steps.version.outputs.new }}
        run: gh release create "$NEW" --generate-notes --title "$NEW"
